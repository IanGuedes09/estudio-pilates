# Laravel + Vite: o Nixpacks pode gerar nginx com dois `location /` (PHP + Node).
# 1) Só provider PHP reduz conflito entre detectores.
# 2) Start explícito evita subir o nginx gerado (origem do erro duplicate location "/").
providers = ["php"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=8000"
